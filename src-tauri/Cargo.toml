[package]
name = "simple-agent"
version = "0.1.0"
description = "Simple Agent — a local-first AI client with an agent loop"
authors = ["Simple Agent"]
edition = "2021"
rust-version = "1.82"

[lib]
name = "simple_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "sync",
  "time",
  "macros",
  "process",
  "io-util",
] }
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "stream",
  "rustls-tls",
  "gzip",
] }
futures-util = "0.3"
rusqlite = { version = "0.41", features = ["bundled"] }
keyring = "4"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
regex = "1"
walkdir = "2"
base64 = "0.23"
percent-encoding = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
